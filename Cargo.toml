[package]
name = "media-suggestion-finder"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "entity",
    "migration",
]

[dependencies]
anyhow = "1.0.104"
async-recursion = "1.1.1"
axum = "0.8.9"
chrono = "0.4.44"
config = "0.15.22"
entity = { path = "entity" }
hotpath = { version = "0.28", features = ["tokio", "sqlx", "axum-0-8"] }
imohash = "0.1.2"
isolang = { version = "2.4.0", features = ["serde"] }
itertools = "0.15.0"
# Downstream mediainfo-rust with some fixes, can revert if issues #1, #2 are fixed upstream
mediainfo-rust = { git = "https://github.com/luigi311/mediainfo-rust", branch = "downstream" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio", "with-chrono"] }
serde = "1.0.229"
tokio = { version = "1.51", features = ["full"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

[features]
default = []
hotpath = ["hotpath/hotpath", "dep:tracing-subscriber"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-prometheus = ["hotpath/hotpath-prometheus"]
hotpath-cloud = ["hotpath/hotpath-cloud"]

[profile.profiling]
inherits = "release"
debug = true
