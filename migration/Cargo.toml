[package]
edition      = "2024"
name         = "migration"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
hotpath = { version = "0.28", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[features]
default = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-prometheus = ["hotpath/hotpath-prometheus"]
hotpath-cloud = ["hotpath/hotpath-cloud"]

[dependencies.sea-orm-migration]
features = [
    "runtime-tokio",
    "sqlx-sqlite",
]
version = "2.0"
